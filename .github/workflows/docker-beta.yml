name: Publish beta image

# Public beta channel, separate from stable releases.
#
#   git tag v2.18.0-beta.1 <commit> && git push origin v2.18.0-beta.1
#
# builds EXACTLY the tagged commit (any branch — typically a PR branch under
# test) and pushes only beta tags to Docker Hub:
#
#   gatoserio/bpm-tagger:v2.18.0-beta.1       gatoserio/bpm-tagger:beta
#   gatoserio/bpm-tagger:v2.18.0-beta.1-full  gatoserio/bpm-tagger:beta-full
#
# It never touches :latest / :full, the Docker Hub overview, or the repo's
# VERSION file — stable releases stay docker-publish.yml's job (a VERSION bump
# on main). The image's VERSION is stamped with the beta version at build time
# so testers' Settings/About and bug reports name the exact build. A GitHub
# *pre-release* carries the notes (the CHANGELOG's Unreleased section + how to
# test); pre-releases don't count as "latest", so the app's update check for
# stable users is unaffected.
#
# Runs from the tagged commit, so this file only has to exist on the branch
# being tagged — no merge to main needed first.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

concurrency:
  group: docker-beta
  cancel-in-progress: false

jobs:
  # Don't hand testers a build that fails the suite: the same gate as ci.yml's
  # backend job, run on the tagged commit itself.
  test:
    name: Test the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Ruff
        run: ruff check bpm_tagger/ tests/
      - name: Pytest
        run: pytest -q

  push:
    name: Build and push beta images
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Beta version from the tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Beta ${version} from $(git rev-parse --short HEAD)"

      # Stamp the image (not the repo): the app reads VERSION at startup.
      - name: Stamp the beta version into the build context
        run: echo "${{ steps.ver.outputs.version }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reads the stable release cache (so unchanged apt/pip layers are reused
      # and pulls stay small) but writes its own, so beta builds never churn
      # the cache the next stable release depends on.
      - name: Build and push slim beta image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WITH_DEEPRHYTHM=false
          cache-from: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:buildcache-slim
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:buildcache-beta-slim
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:buildcache-beta-slim,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:beta
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:v${{ steps.ver.outputs.version }}

      - name: Build and push full beta image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WITH_DEEPRHYTHM=true
          cache-from: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:buildcache-full
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:buildcache-beta-full
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:buildcache-beta-full,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:beta-full
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:v${{ steps.ver.outputs.version }}-full

  # Only after the images are pullable, so a pre-release never points testers
  # at a tag that doesn't exist yet.
  prerelease:
    name: GitHub pre-release
    runs-on: ubuntu-latest
    needs: push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.push.outputs.version }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — nothing to do."
            exit 0
          fi
          {
            echo "> **Beta build for testing — not a stable release.** Stable users on \`:latest\` / \`:full\` are unaffected."
            echo
            echo "### Try it"
            echo
            echo "Back up your \`/data\` folder first, then in \`docker-compose.yml\`:"
            echo
            echo '```yaml'
            echo "image: ${IMAGE}:beta        # or :beta-full · pin this build: :${tag} / :${tag}-full"
            echo '```'
            echo
            echo "then \`docker compose pull && docker compose up -d\`. \`:beta\` always points at the newest beta — re-pull after each new one. To go back: \`image: ${IMAGE}:latest\`."
            echo
            echo "### Report a problem"
            echo
            echo "Open an issue and include **${tag}** (Settings shows the running version), what you did, and \`docker compose logs --tail 200\`."
            echo
            echo "### What's in it"
            echo
            python scripts/release_notes.py --unreleased || echo "_(no Unreleased section in CHANGELOG.md)_"
          } > notes.md
          gh release create "${tag}" --verify-tag --prerelease \
            --title "${tag} (beta)" --notes-file notes.md
