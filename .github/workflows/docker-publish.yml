name: Publish Docker image

on:
  # Manual run: always publishes, even if the version tag already exists on
  # Docker Hub — the escape hatch for re-pushing an image or re-syncing the
  # overview without a version bump.
  workflow_dispatch:

  # Automatic run: fires when CI finishes on main and publishes only if it
  # succeeded AND the repo's VERSION isn't on Docker Hub yet. Gating on CI
  # (rather than `on: push`) keeps a red main from shipping images, and the
  # tag check makes ordinary merges no-ops — only the commit that bumps
  # VERSION (the release commit) actually builds and pushes.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One publish at a time; a second release lands after the first finishes.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide whether to publish
        id: decide
        run: |
          version=$(cat VERSION)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — publishing v${version} unconditionally."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          # Public-repo tag lookup, no auth needed: 200 = already published.
          elif curl -fsS -o /dev/null \
              "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger/tags/v${version}"; then
            echo "v${version} already exists on Docker Hub — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} not on Docker Hub yet — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  push:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.publish == 'true'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- slim image (no PyTorch, ~400 MB) → :latest / :vX.Y.Z ---

      - name: Build and push slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WITH_DEEPRHYTHM=false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:v${{ needs.check.outputs.version }}

      # --- full image (PyTorch + deeprhythm CNN, ~1.8 GB) → :full / :vX.Y.Z-full ---

      - name: Build and push full image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WITH_DEEPRHYTHM=true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:full
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:v${{ needs.check.outputs.version }}-full

      # --- Docker Hub overview: synced from DOCKERHUB_README.md every publish. ---

      # The 25,000-byte overview cap is enforced in ci.yml (the "Docs (Docker Hub
      # overview size)" job) rather than here, so an oversize file is caught on the
      # push that introduces it instead of at publish time. This job always checks
      # out `ref: main` above, and ci.yml gates every push to main, so the file
      # reaching the sync below has already been size-checked.
      #
      # The overview sync hits the Docker Hub *web API* (PATCH the repo), which is
      # a different auth surface than the image push above: the image-push token
      # can succeed while this 403s ("Forbidden") because updating the description
      # needs the account password or a PAT scoped to write the repo. It's a
      # nice-to-have, so it must not fail a publish whose images already pushed —
      # continue-on-error keeps the run green and surfaces the 403 as a warning.
      # Set DOCKERHUB_DESCRIPTION_TOKEN to a password / write-scoped PAT to make
      # the sync actually succeed; it falls back to the push token otherwise.
      - name: Update Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger
          readme-filepath: ./DOCKERHUB_README.md
