name: Publish Docker image

on:
  # Manual run: always publishes, even if the version tag already exists on
  # Docker Hub — the escape hatch for re-pushing an image or re-syncing the
  # overview without a version bump.
  workflow_dispatch:

  # Automatic run: fires when CI finishes on main and publishes only if it
  # succeeded AND the repo's VERSION isn't on Docker Hub yet. Gating on CI
  # (rather than `on: push`) keeps a red main from shipping images, and the
  # tag check makes ordinary merges no-ops — only the commit that bumps
  # VERSION (the release commit) actually builds and pushes.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One publish at a time; a second release lands after the first finishes.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide whether to publish
        id: decide
        run: |
          version=$(cat VERSION)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — publishing v${version} unconditionally."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          # Public-repo tag lookup, no auth needed: 200 = already published.
          elif curl -fsS -o /dev/null \
              "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger/tags/v${version}"; then
            echo "v${version} already exists on Docker Hub — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} not on Docker Hub yet — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  push:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.publish == 'true'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- slim image (no PyTorch, ~400 MB) → :latest / :vX.Y.Z ---

      # Layer cache, kept on Docker Hub alongside the images.
      #
      # Without this, every run builds on a fresh runner with nothing to reuse,
      # so the apt and pip layers are rebuilt from scratch and get brand-new
      # digests even when nothing in them changed — which made a bugfix release
      # a 420 MB re-download for every user (14 of 15 layers changed between
      # v2.17.0 and v2.17.1). With the cache those layers are reused verbatim,
      # keeping their digests, so `docker pull` only fetches the app code.
      #
      # mode=max caches the frontend build stage too, so an unchanged SPA
      # produces a byte-identical dist layer rather than one that differs only
      # by file timestamps. The cache tags are separate per variant so the slim
      # and full builds don't evict each other; they're cache manifests, not
      # runnable images, and appear as `buildcache-*` tags on Docker Hub.
      - name: Build and push slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WITH_DEEPRHYTHM=false
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:buildcache-slim
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:buildcache-slim,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:v${{ needs.check.outputs.version }}

      # --- full image (PyTorch + deeprhythm CNN, ~1.8 GB) → :full / :vX.Y.Z-full ---

      - name: Build and push full image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WITH_DEEPRHYTHM=true
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:buildcache-full
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:buildcache-full,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:full
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:v${{ needs.check.outputs.version }}-full

      # --- Docker Hub overview: synced from DOCKERHUB_README.md every publish. ---

      # The 25,000-byte overview cap is enforced in ci.yml (the "Docs (Docker Hub
      # overview size)" job) rather than here, so an oversize file is caught on the
      # push that introduces it instead of at publish time. This job always checks
      # out `ref: main` above, and ci.yml gates every push to main, so the file
      # reaching the sync below has already been size-checked.
      #
      # The overview sync hits the Docker Hub *web API* (PATCH the repo), which is
      # a different auth surface than the image push above: the image-push token
      # can succeed while this 403s ("Forbidden") because updating the description
      # needs the account password or a PAT scoped to write the repo. It's a
      # nice-to-have, so it must not fail a publish whose images already pushed —
      # continue-on-error keeps the run green and surfaces the 403 as a warning.
      # Set DOCKERHUB_DESCRIPTION_TOKEN to a password / write-scoped PAT to make
      # the sync actually succeed; it falls back to the push token otherwise.
      - name: Update Docker Hub description
        id: overview
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger
          readme-filepath: ./DOCKERHUB_README.md

      # `continue-on-error` above keeps a failed sync from failing a publish whose
      # images already pushed — but GitHub then reports the step's *conclusion* as
      # success, so a 403 was completely invisible and the overview sat several
      # releases stale without anyone noticing. This reads back what Docker Hub
      # actually serves (which also catches a sync that "succeeded" but wrote
      # something clipped or wrong) and raises a red ::error:: annotation on the
      # run. It deliberately does not fail the job: the images are already out,
      # and the release job behind this one must still run.
      - name: Verify the overview actually synced
        if: always()
        run: |
          if [ "${{ steps.overview.outcome }}" = "failure" ]; then
            echo "::warning::The description sync step itself failed — see its log."
          fi
          python scripts/check_overview_sync.py --github             --repo "${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger" || true

  # Tag the release commit and publish a GitHub release whose notes are this
  # version's CHANGELOG section. Runs only after the images are actually on
  # Docker Hub, so a release never advertises a version you can't pull.
  #
  # This exists because the releases page had drifted nineteen versions behind
  # Docker Hub (last release v2.7.0 against a shipped v2.17.0), which made the
  # UI's update check — it reads GitHub's latest release — tell every user they
  # were running something newer than "latest". Reported in #5.
  release:
    runs-on: ubuntu-latest
    needs: [check, push]
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # Idempotent: a manual re-dispatch of an already-released version (the
      # re-push escape hatch) leaves the existing release alone.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — nothing to do."
            exit 0
          fi
          python scripts/release_notes.py "${VERSION}" > notes.md
          gh release create "v${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "$(python scripts/release_notes.py --title "${VERSION}")" \
            --notes-file notes.md
