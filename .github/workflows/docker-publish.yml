name: Publish Docker image

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- slim image (no PyTorch, ~400 MB) → :latest / :vX.Y.Z ---

      - name: Build and push slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WITH_DEEPRHYTHM=false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:v${{ steps.version.outputs.version }}

      # --- full image (PyTorch + deeprhythm CNN, ~1.8 GB) → :full / :vX.Y.Z-full ---

      - name: Build and push full image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WITH_DEEPRHYTHM=true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:full
            ${{ secrets.DOCKERHUB_USERNAME }}/bpm-tagger:v${{ steps.version.outputs.version }}-full
