name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Ruff
        run: ruff check bpm_tagger/ tests/
      - name: Pytest
        run: pytest -q
      # Advisory: heavy ML deps often carry transitive advisories that aren't
      # quickly fixable, so this surfaces them without blocking. Tighten to a
      # hard gate (drop continue-on-error) once the known set is triaged.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Gate on production-dependency vulnerabilities (high+). Dev-only tooling
      # advisories (the vite/esbuild dev server) don't ship, so they're excluded.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
