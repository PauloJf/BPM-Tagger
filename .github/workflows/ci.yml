name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Docker Hub caps a repository's overview at 25,000 bytes, and the publish
  # workflow syncs DOCKERHUB_README.md into it verbatim. Checked here, on every
  # push and PR, rather than at publish time: the file grows with every release
  # (CLAUDE.md requires updating it for user-facing changes), and finding out at
  # publish is finding out too late. Its own job so it fails in seconds instead
  # of behind the test suites, and needs no Python/Node toolchain.
  #
  # NOTE: this measures the file as checked out on Linux, i.e. LF line endings.
  # A CRLF working copy reads ~1 byte per line larger, so a local `wc -c` on
  # Windows overstates the size — compare against `git show :DOCKERHUB_README.md`.
  docs:
    name: Docs (Docker Hub overview size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub overview size (25KB cap)
        run: |
          bytes=$(wc -c < DOCKERHUB_README.md)
          echo "DOCKERHUB_README.md is ${bytes} bytes (cap 25000)"
          if [ "${bytes}" -gt 25000 ]; then
            echo "::error::DOCKERHUB_README.md exceeds Docker Hub's 25,000-byte overview cap"
            exit 1
          fi

      # The publish workflow builds the GitHub release notes from this version's
      # CHANGELOG section, so a missing section would ship a release with empty
      # notes — and it can only be caught here, before the images go out.
      # v2.11.3 and v2.13.0 both shipped with no entry at all.
      - name: Check CHANGELOG has an entry for VERSION
        run: |
          version=$(cat VERSION)
          if ! python3 scripts/release_notes.py "${version}" > /dev/null; then
            echo "::error::CHANGELOG.md has no '## v${version}' section"
            exit 1
          fi
          echo "CHANGELOG.md documents v${version}"

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The runtime image ships ffmpeg, and bpm.audio.load_audio depends on it to
      # decode what libsndfile can't (AAC). Its tests skip when ffmpeg is absent,
      # so without this the .m4a regression path silently goes untested here —
      # which is exactly how it shipped broken in the first place.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Ruff
        run: ruff check bpm_tagger/ tests/
      - name: Pytest
        run: pytest -q
      # Advisory: heavy ML deps often carry transitive advisories that aren't
      # quickly fixable, so this surfaces them without blocking. Tighten to a
      # hard gate (drop continue-on-error) once the known set is triaged.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Gate on production-dependency vulnerabilities (high+). Dev-only tooling
      # advisories (the vite/esbuild dev server) don't ship, so they're excluded.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
