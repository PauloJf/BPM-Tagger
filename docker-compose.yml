services:
  bpm-tagger:
    build: .
    container_name: bpm-tagger
    restart: unless-stopped

    environment:
      # -----------------------------------------------------------------------
      # Operating mode
      #   watch          — scan new/unscanned tracks on start, then watch for new/changed files
      #   watch_all      — re-analyze every track on start, then watch for new/changed files
      #   scan_all       — one-shot: re-analyze every file (ignores existing DB results)
      #   scan_unscanned — one-shot: only analyze files that are new or have changed
      #   scan_review    — one-shot: re-analyze only flagged, errored, or librosa-only tracks
      #   report         — print suspicious tracks to logs, write CSV, send ntfy
      #   lock           — lock a single file (requires LOCK_FILE; LOCK_BPM optional)
      #   unlock         — unlock a file so it will be re-analyzed (requires UNLOCK_FILE)
      # -----------------------------------------------------------------------
      MODE: watch

      # Path to the music directory inside the container (must match the volume below)
      MUSIC_DIR: /music

      # SQLite database path inside the container
      DB_PATH: /data/bpm_tagger.db

      # -----------------------------------------------------------------------
      # ntfy notifications — leave NTFY_URL or NTFY_TOPIC empty to disable
      # -----------------------------------------------------------------------
      NTFY_URL: https://ntfy.sh
      NTFY_TOPIC: ""            # set your topic here, e.g. my-bpm-alerts

      # Minimum seconds between batched tagging notifications (default 5 min)
      NTFY_MIN_INTERVAL: "300"

      # Number of tracks to batch into a single tagging notification
      NTFY_BATCH_SIZE: "10"

      # Include "N need review" in the scan-complete summary notification
      NTFY_NOTIFY_REVIEW: "true"

      # -----------------------------------------------------------------------
      # Tag writing
      # -----------------------------------------------------------------------
      # Write the detected BPM back to the audio file's metadata tag
      WRITE_TAGS: "true"

      # Restore each file's modified time after writing the tag, so Navidrome
      # rescans, backups and sort-by-date views aren't disturbed. Setting this
      # here locks the toggle in the web UI (docker-compose stays authoritative).
      PRESERVE_MTIME: "true"

      # -----------------------------------------------------------------------
      # File extensions to process (comma-separated, include the leading dot)
      # -----------------------------------------------------------------------
      AUDIO_EXTENSIONS: ".mp3,.flac,.ogg,.m4a,.aac,.wav,.opus,.wv"

      # -----------------------------------------------------------------------
      # BPM accuracy: detection quality improvements
      # -----------------------------------------------------------------------

      # Plausibility range — BPM is doubled/halved until it falls in this range.
      # Tip: narrow to 90-160 for pop/rock; widen to 60-220 for jazz/metal.
      BPM_MIN: "60"
      BPM_MAX: "200"

      # Octave correction: when detectors return values that are exactly double/half
      # of each other, pick the one inside [BPM_MIN, BPM_MAX].
      OCTAVE_CORRECTION: "true"

      # Enable essentia RhythmExtractor2013 as a second neural-style detector.
      # Set to "false" to fall back to the previous deeprhythm+librosa behaviour.
      USE_ESSENTIA: "true"

      # Multi-segment librosa analysis: divide the song into N windows and take
      # the median BPM. Reduces influence of quiet intros/outros.
      MULTI_SEGMENT: "true"
      MULTI_SEGMENT_COUNT: "3"    # number of windows
      SEGMENT_DURATION: "45"      # seconds per window

      # -----------------------------------------------------------------------
      # Review / suspicious-track flagging
      # -----------------------------------------------------------------------

      # Confidence below this triggers "needs review" flag in the DB
      REVIEW_CONFIDENCE_THRESHOLD: "0.4"

      # BPM difference between deeprhythm and librosa (not octave-related)
      # that triggers "needs review" flag
      REVIEW_DISAGREE_THRESHOLD: "15"

      # -----------------------------------------------------------------------
      # Report mode (MODE=report)
      # -----------------------------------------------------------------------
      # Path for the CSV export of suspicious tracks
      REPORT_PATH: "/data/review_report.csv"

      # -----------------------------------------------------------------------
      # Lock / unlock modes
      # -----------------------------------------------------------------------
      # MODE=lock  — set LOCK_FILE to the absolute path inside the container.
      #              Optionally set LOCK_BPM to override the BPM value.
      # MODE=unlock — set UNLOCK_FILE to the path to unlock.
      #
      # Example (run once, do not set in the long-running service):
      #   docker compose run --rm --no-deps bpm-tagger \
      #     env MODE=lock LOCK_FILE="/music/artist/track.mp3" LOCK_BPM=128 \
      #     python -m bpm_tagger
      # LOCK_FILE: ""
      # LOCK_BPM: ""
      # UNLOCK_FILE: ""

      # -----------------------------------------------------------------------
      # Detector selection
      # -----------------------------------------------------------------------
      # deeprhythm is a PyTorch CNN that costs ~500 MB RAM per worker.
      # Set to "false" to run essentia + librosa only (~300 MB total peak).
      # Set to "true" for maximum accuracy (requires raising memory limit to 1500M+).
      USE_DEEPRHYTHM: "false"

      # -----------------------------------------------------------------------
      # Parallel processing
      # -----------------------------------------------------------------------
      # Number of worker threads for parallel BPM analysis.
      # Each worker loads its own deeprhythm model (~500 MB RAM each).
      # Keep at 1 on NAS / low-memory devices; raise to 2-4 on a proper server.
      WORKERS: "1"

      # -----------------------------------------------------------------------
      # Navidrome auto-rescan (leave NAVIDROME_URL empty to disable)
      # -----------------------------------------------------------------------
      # After each scan completes, trigger a Navidrome library rescan via the
      # Subsonic-compatible API so your new BPM tags appear immediately.
      NAVIDROME_URL: ""             # e.g. http://navidrome:4533
      NAVIDROME_USER: ""            # Navidrome admin username
      NAVIDROME_PASS: ""            # Navidrome admin password

      # -----------------------------------------------------------------------
      # Grabber — Spotify playlist sync + downloader (M3+). Disabled by default.
      # -----------------------------------------------------------------------
      # Turn the whole subsystem on. Requires ENABLE_UI=true to connect Spotify.
      GRABBER_ENABLED: "false"

      # Spotify Web API (Authorization Code flow). Create an app at
      # https://developer.spotify.com/dashboard and add the redirect URI below
      # to its allow-list *byte-for-byte*. Use https:// in production, or the
      # loopback literal http://127.0.0.1:5000/... for local (NOT "localhost").
      # Client id/secret are env-only — never written to settings.json.
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
      SPOTIFY_REDIRECT_URI: ""      # e.g. https://bpm.example.com/api/spotify/callback
      SPOTIFY_SYNC_MINUTES: "30"    # how often watched playlists re-sync (watch mode)

      # Base URL used in ntfy click links (e.g. the inbox deep link)
      UI_PUBLIC_URL: ""             # e.g. https://bpm.example.com

      # Read file tags into the DB for library matching (leave on)
      INDEX_TAGS: "true"

      # Download providers / pipeline (used from M4). PROVIDER_ORDER is tried in
      # order; OUTPUT_FORMAT is the single transcode target for every download.
      # MONOCHROME_BASE_URL: ""     # self-hosted Tidal proxy base URL
      # MONOCHROME_API_KEY: ""
      # MONOCHROME_QUALITY: "LOSSLESS"
      # PROVIDER_ORDER: "monochrome,ytdlp"
      # OUTPUT_FORMAT: "mp3-320"    # mp3-320 | flac | opus-192
      # PATH_TEMPLATE: "{AlbumArtist}/{Album}/{TrackNo:02d} - {Title}.{ext}"
      # GRAB_WORKERS: "1"           # download/transcode workers (max 3)
      # GRAB_DRY_RUN: "false"       # match + plan without downloading
      # AUTO_ACCEPT_THRESHOLD: "0.85"
      # ASK_THRESHOLD: "0.55"

      # -----------------------------------------------------------------------
      # Hash refresh (run once after upgrading from an older version)
      # -----------------------------------------------------------------------
      # Set to "true" to recompute stored size:mtime hashes for all already-
      # analyzed tracks before the scan starts. Useful if tags were written by
      # a previous version that saved the pre-tag hash, causing every tagged
      # file to be re-analyzed on every restart. Safe to leave enabled — it
      # adds a few seconds on large libraries but causes no re-analysis.
      REFRESH_HASHES: "false"

      # Log verbosity: DEBUG | INFO | WARNING | ERROR
      LOG_LEVEL: INFO

      # -----------------------------------------------------------------------
      # Web UI
      # -----------------------------------------------------------------------
      # Set ENABLE_UI to "true" to start the browser interface on UI_PORT.
      # UI_PASSWORD is required — change it before exposing to a network.
      ENABLE_UI: "false"
      UI_PORT: "5000"
      UI_PASSWORD: ""               # REQUIRED — set a strong password before exposing port 5000
      UI_SECRET_KEY: ""           # auto-generated each restart if empty; set explicitly to persist sessions
      UI_SESSION_HOURS: "24"

      # Brute-force login protection
      UI_MAX_LOGIN_ATTEMPTS: "5"  # failed attempts before lockout (per IP, per 60 s)
      UI_LOCKOUT_SECONDS: "300"   # how long a locked-out IP must wait

    # Memory limit — prevents a runaway container from crashing Docker on a NAS.
    # 800 MB covers essentia+librosa (USE_DEEPRHYTHM=false).
    # Raise to 1500M if you enable USE_DEEPRHYTHM=true; 3 GB for WORKERS > 1.
    deploy:
      resources:
        limits:
          memory: 800M

    # Uncomment when ENABLE_UI=true to let Docker monitor the health of the UI.
    # healthcheck:
    #   test: ["CMD", "python", "-c",
    #          "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 15s

    ports:
      # Expose the web UI (only when ENABLE_UI=true).
      # Bind to localhost only if you don't need external access: "127.0.0.1:5000:5000"
      - "5000:5000"

    volumes:
      # Mount your Navidrome music directory (read-write so tags can be written back)
      - /path/to/your/music:/music

      # Persistent storage for the SQLite database and CSV reports
      - bpm_tagger_data:/data

    # Uncomment and set to match your Navidrome user/group to avoid permission issues
    # user: "1000:1000"

  # ---------------------------------------------------------------------------
  # Optional: a self-hosted ntfy server for notifications (grabber ambiguity
  # pings, scan summaries). Point NTFY_URL above at http://ntfy:80 if you use it.
  # ---------------------------------------------------------------------------
  # ntfy:
  #   image: binwiederhier/ntfy:latest
  #   container_name: ntfy
  #   command: serve
  #   restart: unless-stopped
  #   environment:
  #     NTFY_BASE_URL: http://ntfy
  #   volumes:
  #     - ntfy_data:/var/cache/ntfy
  #   ports:
  #     - "8080:80"

volumes:
  bpm_tagger_data:
  # ntfy_data:
