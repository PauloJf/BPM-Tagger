<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0%" stop-color="#9b6cf5"/>
      <stop offset="100%" stop-color="#5b3ecf"/>
    </linearGradient>
    <linearGradient id="arc_grad" x1="30" y1="130" x2="170" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4a8ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <!-- Subtle top highlight -->
  <rect width="200" height="100" rx="44" fill="white" fill-opacity="0.06"/>

  <!-- Meter arc: center (100,118), radius 68, from ~215° to ~325° -->
  <!-- Start point: 100+68*cos(215°)=100-55.67=44.3, 118+68*sin(215°)=118-38.99=79 -->
  <!-- End point:   100+68*cos(325°)=100+55.67=155.7, 118+68*sin(325°)=118-38.99=79 -->
  <path d="M 44 79 A 68 68 0 1 1 156 79"
        stroke="url(#arc_grad)" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Tick marks at 5 positions along the arc -->
  <!-- Each tick: a short line from radius 60 to radius 72 outward from center (100,118) -->
  <!-- 215° (leftmost) -->
  <line x1="51" y1="84" x2="40" y2="78" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- 247.5° -->
  <line x1="38" y1="103" x2="28" y2="100" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- 270° (top) -->
  <line x1="100" y1="50" x2="100" y2="40" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- 292.5° -->
  <line x1="162" y1="103" x2="172" y2="100" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- 325° (rightmost) -->
  <line x1="149" y1="84" x2="160" y2="78" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Needle — pointing at ~300° (fast-ish, upper-right) -->
  <!-- Endpoint: 100+60*cos(300°)=100+30=130, 118+60*sin(300°)=118-51.96=66 -->
  <line x1="100" y1="118" x2="130" y2="66"
        stroke="white" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center hub -->
  <circle cx="100" cy="118" r="12" fill="white"/>
  <circle cx="100" cy="118" r="6"  fill="#7c6cf0"/>

  <!-- BPM label arc region — small dots as sub-ticks -->
  <circle cx="62"  cy="68"  r="2.5" fill="white" opacity="0.3"/>
  <circle cx="82"  cy="51"  r="2.5" fill="white" opacity="0.3"/>
  <circle cx="118" cy="51"  r="2.5" fill="white" opacity="0.3"/>
  <circle cx="138" cy="68"  r="2.5" fill="white" opacity="0.3"/>

  <!-- Pulse / beat dots below needle to suggest a BPM readout -->
  <rect x="52" y="148" width="8" height="22" rx="4" fill="white" opacity="0.35"/>
  <rect x="66" y="138" width="8" height="32" rx="4" fill="white" opacity="0.55"/>
  <rect x="80" y="143" width="8" height="27" rx="4" fill="white" opacity="0.45"/>
  <rect x="94" y="131" width="8" height="39" rx="4" fill="white" opacity="0.9"/>
  <rect x="108" y="136" width="8" height="34" rx="4" fill="white" opacity="0.7"/>
  <rect x="122" y="145" width="8" height="25" rx="4" fill="white" opacity="0.5"/>
  <rect x="136" y="151" width="8" height="19" rx="4" fill="white" opacity="0.35"/>
</svg>
