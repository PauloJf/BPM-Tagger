<svg width="300" height="90" viewBox="0 0 300 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- V4: Split panel — bold BPM left on accent bg, icon + TAGGER right on dark bg -->
  <defs>
    <linearGradient id="v4bg" x1="0" y1="0" x2="115" y2="90">
      <stop offset="0%" stop-color="#6d5ce7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="v4arc" x1="30" y1="130" x2="170" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4a8ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="v4glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="v4left"><rect width="118" height="90" rx="14"/></clipPath>
    <clipPath id="v4right"><rect x="118" width="182" height="90" rx="14"/></clipPath>
  </defs>

  <!-- Right panel (dark) — drawn first so left overlaps edge cleanly -->
  <rect x="108" width="192" height="90" rx="14" fill="#1a1d27"/>
  <rect x="108.5" y="0.5" width="191" height="89" rx="13.5" stroke="#2a2d3a" fill="none"/>

  <!-- Left panel (purple accent) -->
  <rect width="128" height="90" rx="14" fill="url(#v4bg)"/>

  <!-- BPM on left panel -->
  <text x="64" y="56"
        text-anchor="middle"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="42" font-weight="900" letter-spacing="-1"
        fill="white">BPM</text>

  <!-- Small icon on right panel, scaled to ~44×44 -->
  <g transform="translate(140,23) scale(0.22)">
    <!-- Simplified icon — just arc + needle + bars, no bg -->
    <path d="M 44 79 A 68 68 0 1 1 156 79" stroke="white" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>
    <line x1="51" y1="84" x2="40" y2="78" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="100" y1="50" x2="100" y2="40" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="149" y1="84" x2="160" y2="78" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="100" y1="118" x2="128" y2="68" stroke="white" stroke-width="7" stroke-linecap="round" filter="url(#v4glow)"/>
    <circle cx="100" cy="118" r="11" fill="white"/>
    <circle cx="100" cy="118" r="5.5" fill="#7c6cf0"/>
  </g>

  <!-- TAGGER text on right panel -->
  <text x="213" y="52"
        text-anchor="middle"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="17" font-weight="600" letter-spacing="3"
        fill="#e2e4ed">TAGGER</text>

  <!-- Small descriptor -->
  <text x="213" y="68"
        text-anchor="middle"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="9" font-weight="400" letter-spacing="2"
        fill="#7a7e99">AUTO BPM DETECTION</text>
</svg>
