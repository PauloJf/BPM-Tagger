<svg width="300" height="90" viewBox="0 0 300 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- V3: Dark card with neon glow — text contained inside a rounded panel -->
  <defs>
    <filter id="v3glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="v3bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c6cf0" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="300" height="90" rx="14" fill="#1a1d27"/>
  <rect x="0.5" y="0.5" width="299" height="89" rx="13.5" stroke="#2a2d3a" stroke-width="1" fill="none"/>

  <!-- Accent bar strip along the top edge -->
  <rect width="300" height="3" rx="1.5" fill="url(#v3bar)" opacity="0.6" rx="14"/>
  <rect x="0" y="0" width="300" height="3" rx="14" fill="#7c6cf0" opacity="0.5"/>

  <!-- Beat bars on the left as a visual motif -->
  <rect x="24" y="42" width="5" height="12" rx="2" fill="#7c6cf0" opacity="0.40"/>
  <rect x="32" y="35" width="5" height="19" rx="2" fill="#7c6cf0" opacity="0.60"/>
  <rect x="40" y="28" width="5" height="26" rx="2" fill="#a78bfa" opacity="0.80"/>
  <rect x="48" y="22" width="5" height="32" rx="2" fill="#a78bfa"/>
  <rect x="56" y="30" width="5" height="24" rx="2" fill="#7c6cf0" opacity="0.75"/>
  <rect x="64" y="38" width="5" height="16" rx="2" fill="#7c6cf0" opacity="0.50"/>
  <rect x="72" y="44" width="5" height="10" rx="2" fill="#7c6cf0" opacity="0.35"/>

  <!-- BPM — large, glowing -->
  <text x="168" y="48"
        text-anchor="middle"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="38" font-weight="800" letter-spacing="1"
        fill="#a78bfa" filter="url(#v3glow)">BPM</text>

  <!-- Thin rule -->
  <line x1="105" y1="62" x2="230" y2="62" stroke="#2a2d3a" stroke-width="1"/>

  <!-- TAGGER — centred below rule -->
  <text x="168" y="78"
        text-anchor="middle"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="12" font-weight="400" letter-spacing="8"
        fill="#7a7e99">TAGGER</text>

  <!-- Beat bars on the right (mirrored) -->
  <rect x="228" y="44" width="5" height="10" rx="2" fill="#7c6cf0" opacity="0.35"/>
  <rect x="236" y="38" width="5" height="16" rx="2" fill="#7c6cf0" opacity="0.50"/>
  <rect x="244" y="30" width="5" height="24" rx="2" fill="#7c6cf0" opacity="0.75"/>
  <rect x="252" y="22" width="5" height="32" rx="2" fill="#a78bfa"/>
  <rect x="260" y="28" width="5" height="26" rx="2" fill="#a78bfa" opacity="0.80"/>
  <rect x="268" y="35" width="5" height="19" rx="2" fill="#7c6cf0" opacity="0.60"/>
  <rect x="276" y="42" width="5" height="12" rx="2" fill="#7c6cf0" opacity="0.40"/>
</svg>
